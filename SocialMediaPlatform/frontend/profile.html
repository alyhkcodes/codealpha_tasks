<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FUSE - Profile</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <span class="logo">FU<span class="fuse-accent">S</span>E<span class="fuse-dot"></span></span>
    <div class="nav-links">
      <a href="feed.html" title="Home"></a>
      <a href="messages.html" id="messagesLink" title="Messages"></a>
      <a href="#" id="myProfileLink" title="My Profile"></a>
      <button id="logoutBtn" title="Logout"></button>
    </div>
  </nav>

  <div class="feed-container">
    <div class="profile-header">
      <div id="profileAvatar"></div>
      <div class="username" id="profileUsername"></div>
      <span class="private-badge hidden" id="privateBadge">🔒 Private</span>
      <div class="bio" id="profileBio"></div>

      <div class="profile-stats">
        <div>
          <div class="count" id="postsCount">0</div>
          <div class="label">Posts</div>
        </div>
        <div>
          <div class="count" id="followersCount">0</div>
          <div class="label">Followers</div>
        </div>
        <div>
          <div class="count" id="followingCount">0</div>
          <div class="label">Following</div>
        </div>
      </div>

      <button id="followBtn" class="follow-btn hidden">Follow</button>
      <button id="messageBtn" class="follow-btn following hidden">Message</button>

      <!-- Only shown if viewing your own profile -->
      <div id="ownProfileControls" class="hidden">
        <button id="privacyToggleBtn" class="follow-btn following"></button>
        <button id="requestsInboxBtn" class="follow-btn following hidden">Requests</button>
      </div>

      <!-- Follow requests inbox panel -->
      <div id="requestsPanel" class="requests-panel hidden"></div>

      <!-- Only shown if viewing your own profile -->
      <div id="editBioBox" class="hidden">
        <textarea id="bioInput" placeholder="Update your bio..."></textarea>
        <button id="saveBioBtn">Save Bio</button>
      </div>
    </div>

    <div id="profilePosts"></div>
  </div>

  <div class="bottom-nav">
    <a href="feed.html" title="Home"></a>
    <a href="messages.html" id="messagesLinkMobile" title="Messages"></a>
    <button id="composeShortcut" title="New post"></button>
    <a href="#" id="myProfileLinkMobile" class="active" title="Profile"></a>
    <button id="logoutBtnMobile" title="Logout"></button>
  </div>

  <script src="js/api.js"></script>
  <script src="js/ui-helpers.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
