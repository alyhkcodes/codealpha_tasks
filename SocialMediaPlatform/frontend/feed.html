<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FUSE - Feed</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <span class="logo">FU<span class="fuse-accent">S</span>E<span class="fuse-dot"></span></span>

    <div class="navbar-search">
      <input type="text" id="searchInput" placeholder="Search FUSE..." autocomplete="off">
      <div id="searchResults" class="search-results hidden"></div>
    </div>

    <div class="nav-links">
      <a href="feed.html" title="Home"></a>
      <a href="messages.html" id="messagesLink" title="Messages"></a>
      <a href="#" id="myProfileLink" title="My Profile"></a>
      <button id="logoutBtn" title="Logout"></button>
    </div>
  </nav>

  <div class="feed-container">
    <div class="stories-row" id="storiesRow"></div>

    <div class="feed-tabs">
      <button id="globalTab" class="active">Global</button>
      <button id="followingTab">Following</button>
    </div>

    <div class="post-box" id="composeBox">
      <textarea id="postContent" placeholder="What's on your mind?"></textarea>
      <div class="post-box-footer">
        <button id="postBtn">Post</button>
      </div>
    </div>

    <div id="postsList"></div>
  </div>

  <!-- Story viewer -->
  <div id="storyViewerModal" class="hidden">
    <div id="storyViewerBackdrop"></div>
    <div id="storyViewerContent">
      <button id="storyViewerClose" title="Close">&times;</button>
      <div id="storyViewerProgress"></div>
      <div id="storyViewerHeader"></div>
      <div id="storyViewerBody"></div>
      <button id="storyDeleteBtn" class="hidden" title="Delete story"></button>
    </div>
  </div>

  <!-- Story composer -->
  <div id="storyComposerModal" class="hidden">
    <div id="storyComposerBackdrop"></div>
    <div id="storyComposerContent">
      <button id="storyComposerClose" title="Close">&times;</button>
      <h3>New Story</h3>
      <textarea id="storyText" placeholder="Say something..." maxlength="300"></textarea>
      <input type="file" id="storyImageInput" accept="image/*">
      <img id="storyImagePreview" class="hidden">
      <button id="storyPostBtn">Share Story</button>
    </div>
  </div>
  <div class="bottom-nav">
    <a href="feed.html" class="active" title="Home"></a>
    <a href="messages.html" id="messagesLinkMobile" title="Messages"></a>
    <button id="composeShortcut" title="New post"></button>
    <a href="#" id="myProfileLinkMobile" title="Profile"></a>
    <button id="logoutBtnMobile" title="Logout"></button>
  </div>

  <script src="js/api.js"></script>
  <script src="js/ui-helpers.js"></script>
  <script src="js/feed.js"></script>
</body>
</html>
